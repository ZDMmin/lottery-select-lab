name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests scripts examples

      - name: Unit tests
        run: python -m pytest -q

      - name: Smoke-test every demo
        run: python scripts/run_demo.py

      - name: CLI smoke test
        run: |
          python -m lottery_select_lab generate-data --n 120 --seed 1 --out /tmp/sample.csv
          python -m lottery_select_lab compare --data /tmp/sample.csv --out /tmp/compare
