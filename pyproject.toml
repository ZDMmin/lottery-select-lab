[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lottery-select-lab"
version = "0.1.0"
description = "Lottery-Select-Lab / SSQ-Number-Engine / Number-Picking-Lab — a reproducible research workbench for combination selection: neighbourhood-diffusion scoring, rank-factor mining, multi-horizon voting, and a built-in look-ahead-bias detector."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lottery-Select-Lab contributors" }]
keywords = ["lottery", "combinatorics", "ranking", "scoring-system", "backtesting", "look-ahead-bias", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
graph = ["networkx>=3.1"]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "black>=24.0"]
all = ["lottery-select-lab[graph,ml,dev]"]

[project.scripts]
lottery-select-lab = "lottery_select_lab.cli:main"

[project.urls]
Homepage = "https://github.com/ZDMmin/lottery-select-lab"
Issues = "https://github.com/ZDMmin/lottery-select-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py39"]
